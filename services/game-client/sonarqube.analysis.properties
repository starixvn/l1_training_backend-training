# SonarQube Analysis Properties for sedie-multiplayer-client
sonar.projectKey=sedie-multiplayer-client
sonar.projectName=SeDie Multiplayer Client
sonar.projectVersion=1.0.0

# SonarQube Server Configuration
sonar.host.url=https://sonarqube.lumigame.com

# Source code paths
sonar.sources=src
sonar.tests=src/__tests__

# Exclude patterns
sonar.exclusions=**/*.d.ts,**/*.config.js,**/*.config.ts,**/*.config.json,**/node_modules/**,**/.next/**,**/coverage/**,**/reports/**,**/stryker-examples/**,**/__mocks__/**,**/*.test.tsx,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts

# Test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.testExecutionReportPaths=reports/test-reporter.xml

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate
sonar.qualitygate.wait=true
